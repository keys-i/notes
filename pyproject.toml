[project]
name = "notes"
version = "0.2.0"
description = "notes of all my coursez"
authors = [
    {name = "Keys",email = "70819367+keys-i@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "mkdocs (>=1.1.2)",
    "mkdocs-material (>=9.7.7)",
    "markdown-exec[ansi] (>=1.12.3,<2.0.0)",
    "mkdocs-roamlinks-plugin (>=0.1.3)",
    "mkdocs-mermaid2-plugin (>=1.2.3,<2.0.0)",
    "mkdocs-minify-plugin (>=0.8.0,<0.9.0)",
    "pymdown-extensions (>=11.0.1)",
    "python-markdown-math (>=0.9,<0.10)",
    "mkdocs-obsidian-interactive-graph-plugin (>=0.3.2,<0.4.0)",
    "mkdocs-callouts (>=1.16.1,<2.0.0)",
    "mkdocs-glightbox (>=0.5.2,<0.6.0)",
    "mkdocs-git-authors-plugin (>=0.10.0,<0.11.0)",
    "mkdocs-obsidian-bridge (>=1.3.1,<2.0.0)",
    "mkdocs-obsidian-support-plugin (>=1.4.1,<2.0.0)",
    "mkdocs-print-site-plugin (>=2.8,<3.0)"
]

[project.scripts]
clean = "hooks.tools:clean"
fmt = "hooks.tools:fmt"
lint = "hooks.tools:lint"
serve = "hooks.tools:serve"

[tool.uv.build-backend]
module-name = "hooks"
module-root = ""

[tool.markdownlint-cli2]
gitignore = true

[tool.markdownlint-cli2.config]
MD013 = { line_length = 80, code_blocks = false, tables = false }
MD024 = false
MD025 = { front_matter_title = "" }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
