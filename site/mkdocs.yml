# Site Information
site_name: Rad's Notes
site_url: https://uni.keysi.dev
site_dir: ../public
docs_dir: ../content
site_description: COMP4403 compilers and interpreters notes covering grammars, parsing, semantics, execution, runtime systems, tutorials, and assignments.
site_author: Radhesh Goel

repo_name: keys-i/notes
repo_url: https://github.com/keys-i/notes
edit_uri: edit/main/content/

hooks:
  - hooks/typescript.py
  - hooks/site.py
  - hooks/game.py
  - hooks/callouts.py
  - hooks/graph.py
  - hooks/discovery.py
  - hooks/man.py

# Theme Configuration
theme:
  name: material
  custom_dir: theme
  logo: assets/images/logo.svg

  static_templates:
    - 404.html
  include_search_page: true
  palette:
    - scheme: default # Light mode
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate # Dark mode
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font: false
  features:
    - content.action.view # View action on content
    - content.code.annotate # Allows code annotations
    - content.code.copy # Adds copy button to code blocks
    - content.code.select # Allows code block selection
    - content.tabs.link # Creates links for tabbed content
    - navigation.indexes # Adds indexes for easier navigation
    # - navigation.instant  # Disabled as it breaks some JavaScript functionality
    - navigation.sections # Shows sections in the navigation
    - navigation.top # Adds "Back to top" button
    - search.highlight # Highlights search terms in results
    - search.share # Allows sharing of search results
    - search.suggest # Provides search suggestions
  favicon: assets/images/favicon.ico

extra:
  owner_url: https://keysi.dev
  twitter: keys_i
  social:
    - icon: fontawesome/solid/globe
      link: https://keysi.dev
      name: Radhesh Goel's website
      label: Keysi.dev
      featured: primary
    - logo: assets/images/minis.svg
      link: https://uni.keysi.dev/mini/
      name: Minis
      label: Minis
      featured: secondary
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/radhesh-g
      name: Radhesh Goel on LinkedIn
      label: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/keys-i
      name: Radhesh Goel on GitHub
      label: GitHub
  analytics:
    provider: google
    property: G-7WSKK5Y761
  generator: false
  comments:
    enabled: true
    mode: utterances
    type: issues
# Markdown Extensions
markdown_extensions:
  - codehilite
  - md_in_html
  - def_list
  - sane_lists
  - footnotes # Adds support for footnotes
  - attr_list # Allows adding attributes to elements
  - pymdownx.highlight # Enhances syntax highlighting
  - pymdownx.superfences: # Provides advanced code block fencing
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
        - name: plot
          class: note-plot
          format: !!python/name:hooks.plot.format_plot
  - pymdownx.details # Adds collapsible detail/summary blocks
  - pymdownx.magiclink # Automatically turns URLs into clickable links
  - pymdownx.tasklist # Adds support for task lists
  - pymdownx.emoji # Adds emoji support
  - admonition # Enables warning and note blocks
  - toc:
      title: "On this page"
      permalink: "#"
      toc_depth: 3

  - pymdownx.arithmatex:
      generic: true # Emit MathJax 3-compatible delimiters
  - pymdownx.tilde # Enables strikethroughs
  - pymdownx.caret # Adds caret notation for insertions
  - pymdownx.mark # Adds mark notation for highlighting
  - pymdownx.smartsymbols # Adds smart symbols for better typography

# Plugins for added functionality
plugins:
  - search # Enables search functionality across the site
  - callouts
  - obsidian-support
  - obsidian-interactive-graph # Interactive graph functionality for visualizing connections
  - mermaid2:
      javascript: https://unpkg.com/mermaid@11.16.1/dist/mermaid.esm.min.mjs
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      js_files:
        - assets/js/freebsd.boot.js
        - assets/js/404/game.js
        - assets/js/404/shell.js
        - assets/js/404/panic.js
        - assets/js/comments.js
        - assets/js/graph.js
        - assets/js/math.js
        - assets/js/pet.js
        - assets/js/plot.js
        - assets/js/zoom.mermaid.js
      css_files:
        - assets/styles/site.css
        - assets/styles/freebsd.boot.css
        - assets/styles/404/panic.css
        - assets/styles/404/game.css
        - assets/styles/404/shell.css
        - assets/styles/graph.css
        - assets/styles/pet.css
        - assets/styles/plot.css
        - assets/styles/zoom.mermaid.css
  - git-authors:
      show_contribution: false
      show_line_count: false
      show_email_address: false
      count_empty_lines: false
      fallback_to_empty: false
      sort_authors_by: name
      authorship_threshold_percent: 20
      exclude:
        - index.md
      enabled: true
  - print-site
  # Add more plugins as needed, such as mkdocs-git-revision-date for versioning
