<section class="papers" aria-label="Past year paper library" data-course="{{ paper_catalog.course }}">
  <div class="papers__tools">
    <label for="papers-search">Find a paper</label>
    <input id="papers-search" type="search" autocomplete="off" placeholder="Try “2022 solutions” or “latest paper”" disabled />
  </div>
  <section class="papers__preview" id="papers-preview" aria-label="Paper preview" hidden>
    <div class="papers__preview-bar">
      <div class="papers__preview-heading"><span class="papers__preview-mode" id="papers-preview-mode" aria-live="polite">Reading</span><strong id="papers-preview-title"></strong></div>
      <div class="papers__preview-actions">
        <details class="papers__display" id="papers-display">
        <summary aria-label="Themes and settings" title="Themes and settings"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z"/></svg></summary>
        <div class="papers__display-options" aria-label="Themes and settings">
          <strong class="papers__display-title">Themes &amp; Settings</strong>
          <div class="papers__display-controls" role="group" aria-label="Document size and contrast">
            <span class="papers__display-size">
              <button type="button" data-paper-zoom="-1" aria-label="Decrease document size" title="Decrease document size"><span aria-hidden="true">A</span></button>
              <button type="button" data-paper-zoom="1" aria-label="Increase document size" title="Increase document size"><span aria-hidden="true">A</span></button>
            </span>
            <button id="papers-dark" type="button" aria-label="Toggle dark reading" title="Dark reading" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z"/></svg></button>
          </div>
          <div class="papers__display-themes" role="group" aria-label="Reader theme">
            <button type="button" data-paper-theme="original" aria-label="Original reader theme" title="Original" aria-pressed="true"><span>Aa</span>Original</button>
            <button type="button" data-paper-theme="quiet" aria-label="Quiet reader theme" title="Quiet" aria-pressed="false"><span>Aa</span>Quiet</button>
            <button type="button" data-paper-theme="paper" aria-label="Paper reader theme" title="Paper" aria-pressed="false"><span>Aa</span>Paper</button>
            <button type="button" data-paper-theme="bold" aria-label="Bold reader theme" title="Bold" aria-pressed="false"><span>Aa</span>Bold</button>
            <button type="button" data-paper-theme="calm" aria-label="Calm reader theme" title="Calm" aria-pressed="false"><span>Aa</span>Calm</button>
            <button type="button" data-paper-theme="focus" aria-label="Focus reader theme" title="Focus" aria-pressed="false"><span>Aa</span>Focus</button>
          </div>
        </div>
        </details>
        <button id="papers-preview-edit" type="button" aria-label="Edit paper here" title="Edit paper here" hidden><svg class="papers__edit-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 16 11-11 4 4L8 20l-5 1zM13.5 6.5l4 4"/></svg><svg class="papers__read-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5c3-1.5 6-1.5 9 0 3-1.5 6-1.5 9 0v13c-3-1.5-6-1.5-9 0-3-1.5-6-1.5-9 0zM12 5.5v13"/></svg></button>
        <button id="papers-preview-fullscreen" type="button" aria-label="View paper full screen" title="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
        <button id="papers-preview-close" type="button" aria-label="Close preview" title="Close preview"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
      </div>
    </div>
    <div class="papers__viewer">
      <nav class="papers__outline" id="papers-outline" aria-label="Questions in this paper" hidden>
        <strong>Questions</strong>
        <ol id="papers-outline-items"></ol>
      </nav>
      <iframe id="papers-preview-frame" title="Paper preview" loading="lazy" referrerpolicy="no-referrer"></iframe>
    </div>
    <details class="papers__trouble"><summary>Paper not loading?</summary><p>Google may require access to this file. <a id="papers-preview-fallback" href="#" target="_blank" rel="noopener noreferrer">Open the source file ↗</a></p></details>
  </section>
  <p class="papers__status" id="papers-status" role="status">Loading papers…</p>
  <p class="papers__empty" id="papers-empty" role="status" hidden>No papers match that search. Try a year, title, or paper type.</p>
  <div class="papers__list" id="papers-groups"></div>
  <template id="papers-item-template">
    <article class="papers__item">
      <button class="papers__read" type="button" title="Read here"><span class="papers__label"><span class="papers__year"></span><span class="papers__title"></span></span><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5c3-1.5 6-1.5 9 0 3-1.5 6-1.5 9 0v13c-3-1.5-6-1.5-9 0-3-1.5-6-1.5-9 0zM12 5.5v13"/></svg></button>
    </article>
  </template>
</section>
