name: Checks

on:
  pull_request:
    paths-ignore:
      - README.md
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

env:
  NO_MKDOCS_2_WARNING: "1"

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.11.32"
      - name: Test and lint
        run: |
          uv run --locked coverage erase
          uv run --locked coverage run tests/hooks.test.py
          uv run --locked coverage report
          uv run --locked python tests/site.test.py
          uv run --locked ruff format --check .
          uv run --locked ruff check .

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          cache: npm
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit
      - name: Test browser runtime
        run: npm run --silent coverage:web
      - name: Type-check browser tests
        run: npx --no-install tsc --project site/tsconfig.tests.json

  rust:
    name: Rust worker
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            site/api/target
          key: rust-${{ runner.os }}-${{ hashFiles('site/api/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Check native and Wasm targets
        run: |
          rustup target add wasm32-unknown-unknown
          cargo fmt --manifest-path site/api/Cargo.toml --check
          cargo test --locked --manifest-path site/api/Cargo.toml
          cargo clippy --locked --manifest-path site/api/Cargo.toml --all-targets -- -D warnings
          cargo check --locked --manifest-path site/api/Cargo.toml --target wasm32-unknown-unknown

  site:
    name: Strict site build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.11.32"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          cache: npm
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit
      - run: uv run --locked --no-dev mkdocs build --strict --config-file site/mkdocs.yml
