name: Checks

on:
  pull_request:
    paths-ignore:
      - README.md
  push:
    branches: [main, master]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.32"
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run tests
        run: uv run --locked test
      - name: Run linters
        run: uv run --locked lint
