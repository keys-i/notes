name: Checks

on:
  pull_request:
    paths-ignore:
      - README.md
  push:
    branches: [main, master]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run tests
        run: uv run --locked test
      - name: Enforce Python product coverage
        run: |
          uv run --locked coverage erase
          uv run --locked coverage run tests/hooks.test.py
          uv run --locked coverage report
      - name: Enforce browser runtime coverage
        run: npm run --silent coverage:web
      - name: Check Rust worker
        run: |
          rustup target add wasm32-unknown-unknown
          cargo fmt --manifest-path site/api/Cargo.toml --check
          cargo test --locked --manifest-path site/api/Cargo.toml
          cargo clippy --locked --manifest-path site/api/Cargo.toml --all-targets -- -D warnings
          cargo check --locked --manifest-path site/api/Cargo.toml --target wasm32-unknown-unknown
      - name: Run linters
        run: uv run --locked lint
