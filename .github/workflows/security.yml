name: Security

on:
  pull_request:
    paths:
      - .github/workflows/**
      - package-lock.json
      - package.json
      - pyproject.toml
      - site/api/Cargo.lock
      - site/api/Cargo.toml
      - uv.lock

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
